name: release

# Push a tag like v1.0.0 (or v1.0.0rc1) to release. See RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        id: version
        run: |
          version=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('src/areafluforecast/__init__.py').read_text()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi
          grep -q "^version: $version$" CITATION.cff || { echo "CITATION.cff is not at $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no $version entry"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run every offline test against it
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install "$(ls dist/*.whl)[dev]"
          cd "$RUNNER_TEMP"
          pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests" -m "not network and not research"

  publish:
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token is stored anywhere. The "pypi"
    # environment and the PyPI side are set up once (RELEASING.md).
    environment:
      name: pypi
      url: https://pypi.org/project/areaFluForecast/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Publishing the GitHub release is what Zenodo archives (and mints a DOI for).
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: |
          python - "${{ needs.build.outputs.version }}" > notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md").read()
          match = re.search(rf"^## \[{re.escape(sys.argv[1])}\].*?\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip())
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build.outputs.version }}"
          flags=""
          if echo "$version" | grep -qE '(a|b|rc)[0-9]+$'; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "areaFluForecast $version" \
            --notes-file notes.md $flags
