name: tests

on:
  push:
  pull_request:
  schedule:
    # Mondays: rerun everything against the newest dependency releases, plus the
    # tests that need the internet (Open-Meteo).
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6" cffconvert
      - run: ruff check .
      - name: CITATION.cff is valid (Zenodo and GitHub read it)
        run: cffconvert --validate

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch on Linux)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e ".[dev]"
      - name: Unit and smoke tests
        run: pytest -q -m "not network and not research"

  minimum-dependencies:
    # The oldest versions pyproject.toml allows must really work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.1.2" --index-url https://download.pytorch.org/whl/cpu
          pip install -c ci/minimum-constraints.txt -e ".[dev]"
          python -c "import numpy, pandas, scipy, torch, torch_geometric as g; print(numpy.__version__, pandas.__version__, scipy.__version__, torch.__version__, g.__version__)"
      - run: pytest -q -m "not network and not research"

  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest -q -m network

  package:
    # Build the sdist and wheel, then test the installed wheel, not the checkout:
    # this is what catches files missing from the package (sample data, weights).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel and run the tests against it
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "$(ls dist/*.whl)[dev]"
          cd "$RUNNER_TEMP"
          areaflu --version
          python -c "import areafluforecast as af; print(af.pretrained('boston'))"
          pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests" -m "not network and not research and not slow"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the documentation (fails on any warning)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
