# Read the Docs build configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The API reference is generated by reading the source (mkdocstrings/griffe), and
# the example notebooks are rendered from their saved outputs, so the build does
# not install PyTorch or run any model: only the docs tools are installed.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
